name: SPARK Verification

on:
  push:
    paths:
      - 'Formal_verification/lord_spark/**'
      - '.github/workflows/spark-verify.yml'
  pull_request:
    paths:
      - 'Formal_verification/lord_spark/**'
      - '.github/workflows/spark-verify.yml'

jobs:
  verify:
    name: Verify SPARK/Ada proofs with GNATprove
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alire (Ada package manager)
        uses: alire-project/setup-alire@v3
        with:
          # alr 2.0.1 cannot resolve the gnatprove binary crate's per-arch
          # origin (Host_Arch case-expression), reporting it missing:unavailable.
          # 2.1.0 resolves and downloads it.
          version: 2.1.0

      - name: Select GNAT and GPRbuild toolchain
        run: alr toolchain --select gnat_native gprbuild

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.local/share/alire
          # Cache key includes the alr version: the previous alr-2.0.1 cache
          # holds an incomplete (gnatprove-less) solution that must not be reused.
          key: alire-spark-alr210-${{ hashFiles('Formal_verification/lord_spark/alire.toml') }}
          restore-keys: |
            alire-spark-alr210-

      - name: Fetch and provision dependencies (including GNATprove)
        working-directory: Formal_verification/lord_spark
        # `alr update` only refreshes the index. `alr build` resolves the
        # solution and downloads the GNATprove binary archive (and its prover
        # backend) so that `alr exec -- gnatprove` can actually run.
        run: |
          alr update
          alr build

      - name: Run GNATprove
        working-directory: Formal_verification/lord_spark
        # --steps is deterministic (machine-independent), so proof success does
        # not depend on the CI runner's speed, unlike a wall-clock --timeout.
        run: alr exec -- gnatprove -P lord_spark.gpr --level=2 --steps=100000 --report=fail
